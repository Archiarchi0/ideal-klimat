:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183342;background:#f1f5f7}*{box-sizing:border-box}body{margin:0}header{background:#102f3c;color:white;padding:18px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border:1px solid #dce6e9;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #1232}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0;flex:1;min-width:170px}input,select{font:inherit;padding:10px;border:1px solid #c9d9df;border-radius:9px;max-width:100%;background:white}button{font:inherit;cursor:pointer;background:#126e76;color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:600}button.secondary{background:#e8f0f3;color:#244954}button.danger{background:#fce6e8;color:#a02533}button:disabled{opacity:.5}h1{font-size:23px}h2{font-size:18px;margin-top:0}.muted{color:#657b86;font-size:13px}.error{color:#a52d39;white-space:pre-wrap}.ok{color:#14734c}.item{padding:15px;border:1px solid #d9e5e8;border-radius:12px;cursor:pointer}.item:hover{border-color:#128087}.tag{font-size:12px;background:#eaf2f4;padding:4px 8px;border-radius:20px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.tabs button{background:#e7eef1;color:#345764}.tabs button.active{background:#126e76;color:white}table{width:100%;border-collapse:collapse;min-width:560px}td,th{padding:10px;border-bottom:1px solid #e6ecee;text-align:left;font-size:13px}th{background:#f4f7f8}.scroll{overflow:auto}.money{font-variant-numeric:tabular-nums}a{color:#126e76}#notice{position:sticky;top:0;z-index:2;background:#fff9e7;padding:10px 16px;display:none;border-bottom:1px solid #ecd9a3}
</style></head><body><header><div><b style="font-size:21px">Идеал Климат <span style="color:#8bd3cc">3.0</span></b><div style="font-size:12px;color:#a6c4cc">Облачная версия · данные в Supabase</div></div><div class="row"><span id="identity" style="font-size:13px"></span><button id="logout" class="secondary" hidden>Выйти</button></div></header><div id="notice"></div><main id="app">Загрузка…</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const URL_BASE='https://oxkcdoewwltpsfzmizzj.supabase.co';
const PUBLIC_KEY='sb_publishable_RnfncOxIZ_jg0wp0BSt3Tw_gIpi4OLD';
const sb=window.supabase?.createClient(URL_BASE,PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const SECTIONS=['Котельная','Отопление','ВК','Электрика','Вентиляция','Наружные сети','Автоматика','Прочее'];
const BUCKET='object-documents';
const CATEGORIES=['Материалы','Оплата бригады','Субподряд','Транспорт','Накладные расходы','Комиссия партнёру','Прочее'];
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), rub=n=>Math.round(Number(n)||0).toLocaleString('ru-RU')+' ₽', num=x=>Number(x)||0;
let user=null, objects=[],current=null, tab='estimates', rows=[],busy=false;
function alertMsg(message,error=false){let el=$('notice');el.style.display='block';el.className=error?'error':'ok';el.textContent=message;window.scrollTo({top:0,behavior:'smooth'});}
function err(e){alertMsg(e?.message||String(e),true);console.error(e)}
function field(label,id,value='',type='text'){return `<label class="field"><span class="muted">${esc(label)}</span><input id="${id}" type="${type}" value="${esc(value??'')}"></label>`}
function sel(label,id,opts,value){return `<label class="field"><span class="muted">${esc(label)}</span><select id="${id}">${opts.map(x=>`<option ${x===value?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label>`}
function val(id){return $(id)?.value??''}
function showLogin(){current=null;$('identity').textContent='';$('logout').hidden=true;$('app').innerHTML=`<div class="card" style="max-width:440px;margin:45px auto"><h1>Вход в Идеал Климат</h1><p class="muted">Используй логин и пароль, созданные в Supabase Authentication.</p><form id="loginForm">${field('Email','email','','email')}${field('Пароль','password','','password')}<button type="submit">Войти</button></form><p id="loginError" class="error"></p></div>`;$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';let {error}=await sb.auth.signInWithPassword({email:val('email').trim(),password:val('password')});if(error)$('loginError').textContent=error.message;else await initialize()}}
async function initialize(){if(!sb){$('app').textContent='Не загрузилась библиотека Supabase. Проверь интернет.';return}let {data:{user:u},error}=await sb.auth.getUser();if(error||!u){user=null;showLogin();return}user=u;$('identity').textContent=u.email;$('logout').hidden=false;let membership=await sb.from('team_members').select('user_id').eq('user_id',u.id).maybeSingle();if(membership.error||!membership.data){$('app').innerHTML='<div class="card error">Эта учётная запись не включена в команду. Проверь таблицу team_members.</div>';return}await home()}
async function home(){current=null;let {data,error}=await sb.from('objects').select('*').order('created_at',{ascending:false});if(error){err(error);return}objects=data||[];$('app').innerHTML=`<div class="row between"><h1>Объекты <span class="tag">${objects.length}</span></h1><div class="row"><button id="refresh">Обновить</button><button id="new">+ Новый объект</button></div></div><p class="muted">Изменения сохраняются в облаке. Для просмотра изменений другого пользователя нажми «Обновить».</p><div class="grid">${objects.map(o=>`<div class="item" data-open="${o.id}"><b>${esc(o.name)}</b><p class="muted">${esc(o.partner||'Партнёр не указан')}</p><span class="tag">${esc(o.responsible||'Арчи')}</span> <span class="tag">${o.status==='done'?'Завершён':'В работе'}</span></div>`).join('')||'<div class="card">Пока нет объектов. Создай первый тестовый объект.</div>'}</div>`;$('refresh').onclick=home;$('new').onclick=()=>editObject();document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openObject(el.dataset.open))}
function editObject(o){$('app').innerHTML=`<div class="card"><div class="row between"><h1>${o?'Настройки объекта':'Новый объект'}</h1><button class="secondary" id="back">Назад</button></div><form id="objectForm">${field('Название объекта','objName',o?.name||'')}${field('Партнёр / заказчик','objPartner',o?.partner||'')}<div class="row">${sel('Ответственный','objResponsible',['Арчи','Мика'],o?.responsible||'Арчи')}${sel('Статус','objStatus',['active','done'],o?.status||'active')}${field('Площадь, м²','objArea',o?.area||0,'number')}</div><div class="row">${field('Дата начала','objStart',o?.start_date||'','date')}${field('Дата окончания','objEnd',o?.end_date||'','date')}${field('Готовность, %','objProgress',o?.progress||0,'number')}</div><button type="submit">Сохранить в облаке</button></form></div>`;$('back').onclick=()=>o?openObject(o.id):home();$('objectForm').onsubmit=async e=>{e.preventDefault();let name=val('objName').trim();if(!name)return alert('Введи название');let payload={name,partner:val('objPartner'),responsible:val('objResponsible'),status:val('objStatus'),area:num(val('objArea')),start_date:val('objStart')||null,end_date:val('objEnd')||null,progress:num(val('objProgress'))};let q=o?sb.from('objects').update(payload).eq('id',o.id):sb.from('objects').insert(payload);let {data,error}=await q.select('id').single();if(error)return err(error);await openObject(data.id)}}
async function openObject(id){let {data,error}=await sb.from('objects').select('*').eq('id',id).single();if(error)return err(error);current=data;tab='estimates';await renderObject()}
const tabs=[['estimates','Смета'],['extras','Допы'],['incomes','Поступления'],['expenses','Расходы'],['documents','Документы']];
async function renderObject(){if(!current)return home();let o=current;$('app').innerHTML=`<div class="row between"><button class="secondary" id="back">← К объектам</button><div class="row"><button class="secondary" id="settings">Настройки</button><button class="secondary" id="reload">Обновить</button></div></div><h1>${esc(o.name)}</h1><p class="muted">Ответственный: ${esc(o.responsible)} · ${esc(o.partner||'Без партнёра')} · ${o.status==='done'?'Завершён':'В работе'}</p><div class="tabs">${tabs.map(([k,t])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${t}</button>`).join('')}</div><div id="section" class="card">Загрузка…</div>`;$('back').onclick=home;$('settings').onclick=()=>editObject(o);$('reload').onclick=()=>openObject(o.id);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;await renderObject()});await renderSection()}
async function renderSection(){let {data,error}=await sb.from(tab).select('*').eq('object_id',current.id).order('created_at',{ascending:false});if(error)return err(error);rows=data||[];let titles={estimates:'Смета по разделам',extras:'Дополнительные работы',incomes:'Поступления',expenses:'Расходы',documents:'Документы'};let total=rows.reduce((s,r)=>s+num(r.amount),0);$('section').innerHTML=`<div class="row between"><h2>${titles[tab]}</h2><button id="addRow">+ Добавить</button></div>${['incomes','expenses'].includes(tab)?`<p><b>Итого: ${rub(total)}</b></p>`:''}<div class="scroll"><table><thead><tr>${headers().map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join('')}<td><button class="secondary" data-edit="${r.id}">Изменить</button> <button class="danger" data-delete="${r.id}">×</button></td></tr>`).join('')||`<tr><td colspan="8" class="muted">Записей пока нет</td></tr>`}</tbody></table></div><div id="rowForm"></div>`;$('addRow').onclick=()=>editRow();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRow(rows.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRow(b.dataset.delete));document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>openFile(b.dataset.file))}
function headers(){return ({estimates:['Раздел','Работы','Материалы','Транспорт','План работ','План материалов'],extras:['Наименование','Раздел','Работы','Материалы','План работ','План материалов'],incomes:['Дата','Сумма','Комментарий'],expenses:['Дата','Категория','Сумма','Комментарий'],documents:['Название','Тип','Ссылка']})[tab]}
function cells(r){switch(tab){case'estimates':return [esc(r.section),rub(r.work),rub(r.material),rub(r.transport),rub(r.plan_work),rub(r.plan_material)];case'extras':return [esc(r.name),esc(r.section),rub(r.work),rub(r.material),rub(r.plan_work),rub(r.plan_material)];case'incomes':return [esc(r.date),rub(r.amount),esc(r.note)];case'expenses':return [esc(r.date),esc(r.category),rub(r.amount),esc(r.note)];case'documents':return [esc(r.name),esc(r.document_type),r.document_type==='link'?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Открыть</a>`:`<button class="secondary" data-file="${esc(r.id)}">Открыть файл</button>`]}}
function editRow(r){let f='';if(tab==='estimates'||tab==='extras'){f=(tab==='extras'?field('Название работы','f_name',r?.name||''):'')+sel('Раздел','f_section',SECTIONS,r?.section||SECTIONS[0])+`<div class="row">`+field('Работы, ₽','f_work',r?.work||0,'number')+field('Материалы, ₽','f_material',r?.material||0,'number')+(tab==='estimates'?field('Транспорт, ₽','f_transport',r?.transport||0,'number'):'')+field('План затрат на работы, ₽','f_plan_work',r?.plan_work||0,'number')+field('План затрат на материалы, ₽','f_plan_material',r?.plan_material||0,'number')+'</div>'}else if(tab==='incomes'||tab==='expenses'){f=`<div class="row">${field('Дата','f_date',r?.date||new Date().toISOString().slice(0,10),'date')}${field('Сумма, ₽','f_amount',r?.amount||0,'number')}${tab==='expenses'?sel('Категория','f_category',CATEGORIES,r?.category||CATEGORIES[0]):''}</div>`+field('Комментарий','f_note',r?.note||'')}else{f=field('Название документа','f_name',r?.name||'')+(r?.document_type==='file'?'<p class="muted">При редактировании файла можно изменить только название.</p>':`<div class="row">${sel('Источник','f_type',['Файл','Ссылка'],r?.document_type==='link'?'Ссылка':'Файл')}</div><label class="field"><span class="muted">Выбрать файл (до 50 МБ)</span><input type="file" id="f_file"></label>${field('Ссылка https:// (если выбран тип «Ссылка»)','f_url',r?.url||'','url')}`)}$('rowForm').innerHTML=`<hr><h2>${r?'Изменить запись':'Новая запись'}</h2><form id="entry">${f}<div class="row"><button type="submit">Сохранить</button><button type="button" class="secondary" id="cancel">Отмена</button></div></form>`;$('cancel').onclick=()=>{$('rowForm').innerHTML=''};$('entry').onsubmit=async e=>{e.preventDefault();let p={object_id:current.id};if(['estimates','extras'].includes(tab)){p.section=val('f_section');for(let k of ['work','material','plan_work','plan_material'])p[k]=num(val('f_'+k));if(tab==='extras')p.name=val('f_name').trim();else p.transport=num(val('f_transport'))}else if(['incomes','expenses'].includes(tab)){p.date=val('f_date');p.amount=num(val('f_amount'));p.note=val('f_note');if(tab==='expenses')p.category=val('f_category');if(p.amount<=0)return alert('Сумма должна быть больше нуля')}else{p.name=val('f_name').trim();if(!p.name)return alert('Введи название документа');if(r?.document_type==='file'){p.document_type='file';p.storage_path=r.storage_path}else if(val('f_type')==='Ссылка'){p.url=val('f_url').trim();p.document_type='link';p.storage_path=null;if(!/^https:\/\//i.test(p.url))return alert('Ссылка должна начинаться с https://')}else{let file=$('f_file')?.files?.[0];if(!file)return alert('Выбери файл');if(file.size>50*1024*1024)return alert('Максимальный размер файла 50 МБ');let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let path=`${current.id}/${crypto.randomUUID()}-${safe}`;let uploaded=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(uploaded.error)return err(uploaded.error);p.document_type='file';p.storage_path=path;p.url=null;let {error:saveError}=await sb.from('documents').insert(p);if(saveError){await sb.storage.from(BUCKET).remove([path]);return err(saveError)}await renderSection();return}}if(!r&&tab==='estimates'&&rows.some(x=>x.section===p.section))return alert('Этот раздел уже есть. Нажми «Изменить»');let query=r?sb.from(tab).update(p).eq('id',r.id):sb.from(tab).insert(p);let {error}=await query;if(error)return err(error);await renderSection()}}
async function openFile(id){let r=rows.find(x=>x.id===id);if(!r?.storage_path)return;let {data,error}=await sb.storage.from(BUCKET).createSignedUrl(r.storage_path,120);if(error)return err(error);window.open(data.signedUrl,'_blank','noopener,noreferrer')}
async function deleteRow(id){if(!confirm('Удалить запись?'))return;let r=rows.find(x=>x.id===id);let {error}=await sb.from(tab).delete().eq('id',id);if(error)return err(error);if(tab==='documents'&&r?.document_type==='file'&&r.storage_path){let removed=await sb.storage.from(BUCKET).remove([r.storage_path]);if(removed.error)err(removed.error)}await renderSection()}
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;showLogin()};if(sb){sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')showLogin()});initialize()}else $('app').innerHTML='<div class="card error">Не удалось загрузить Supabase. Проверь подключение к интернету.</div>';
</script></body></html>
