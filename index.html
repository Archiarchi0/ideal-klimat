<header class="top"><div><div class="brand">Идеал Климат</div><div class="sub">Облачный учёт · версия 3.0</div></div><div class="row"><span id="identity" class="small"></span><button class="btn secondary sm" onclick="refreshCloud()">↻ Обновить</button><button class="btn secondary sm" onclick="showBackups()">Резервная копия</button><button class="btn secondary sm" onclick="logoutCloud()">Выйти</button></div></header>
<main class="shell"><div id="app"></div><div class="foot">Облачное хранение Supabase · общие данные Арчи и Мики. Перед массовыми изменениями сохраняйте резервную копию.</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
try {

const KEY='ideal-klimat-v2',OLD='ideal-klimat-v1';
const sections=['Котельная','Отопление','ВК','Электрика','Вентиляция','Наружные сети','Автоматика','Прочее'];
const categories=['Материалы','Оплата бригады','Субподряд','Транспорт','Накладные расходы','Комиссия партнёру','Прочее'];
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const money=n=>Math.round(Number(n)||0).toLocaleString('ru-RU');
const n=x=>Number(x)||0;
const sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0);
const id=()=>globalThis.crypto?.randomUUID?.()||'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);
const iso=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const opt=(values,selected)=>values.map(v=>`<option value="${safe(v)}" ${v===selected?'selected':''}>${safe(v)}</option>`).join('');
const get=(field)=>$(field)?.value??'';
const value=(field)=>n(get(field));
function blankObject(){return {id:id(),name:'',partner:'',area:0,start:'',end:'',progress:0,status:'active',estimate:[],extras:[],income:[],expense:[],commissionType:'none',commissionValue:0,planOverhead:0,responsible:'Арчи',documents:[]}}
function normalize(o){let x={...blankObject(),...o};x.id=x.id||id();x.estimate=Array.isArray(x.estimate)?x.estimate:[];x.extras=Array.isArray(x.extras)?x.extras:[];x.income=Array.isArray(x.income)?x.income:[];x.expense=Array.isArray(x.expense)?x.expense:[];x.documents=Array.isArray(x.documents)?x.documents:[];for(let key of ['estimate','extras','income','expense'])x[key]=x[key].map(row=>({...row,id:row.id||id()}));x.status=x.status==='done'?'done':'active';return x}
function initialState(){return {version:2,objects:[]}}
function load(){try{let v=JSON.parse(localStorage.getItem('ik-cloud-readonly-cache'));if(v&&Array.isArray(v.objects))return {version:2,objects:v.objects.map(normalize)}}catch(e){}try{let old=JSON.parse(localStorage.getItem(OLD));if(old&&typeof old==='object'&&!Array.isArray(old)){let o=normalize({...old,id:id(),area:0,start:'',end:'',status:'active',extras:[],planOverhead:0});return {version:2,objects:[o]}}}catch(e){}return initialState()}
let state=initialState(),selected=null,view='home',filter='active',tab='estimate',edit={type:null,id:null},responsibleFilter='all';
function persist(){queueCloudSave();return true}
function object(){return state.objects.find(x=>x.id===selected)}
function lineRevenue(x){return n(x.work)+n(x.material)+n(x.transport)}
function linePlan(x){return n(x.planWork)+n(x.planMaterial)+n(x.planOther)}
function commission(o){let all=[...o.estimate,...o.extras],v=n(o.commissionValue);if(o.commissionType==='fixed')return v;let base=o.commissionType==='works'?sum(all,x=>n(x.work)):o.commissionType==='materials'?sum(all,x=>n(x.material)):o.commissionType==='all'?sum(all,lineRevenue):0;return base*v/100}
function calc(o){let lines=[...o.estimate,...o.extras],estimate=sum(o.estimate,lineRevenue),extras=sum(o.extras,lineRevenue),total=estimate+extras,income=sum(o.income,x=>n(x.amount)),expense=sum(o.expense,x=>n(x.amount)),plan=sum(lines,linePlan)+n(o.planOverhead),fee=commission(o),feePaid=sum(o.expense,x=>x.category==='Комиссия партнёру'?n(x.amount):0);return {estimate,extras,total,income,expense,plan,fee,feePaid,remaining:total-income,cash:income-expense,plannedProfit:total-plan-fee,actualProfit:total-expense,perSq:n(o.area)>0?total/n(o.area):null,workSq:n(o.area)>0?sum(lines,x=>n(x.work))/n(o.area):null}}
function nav(next){view=next;edit={type:null,id:null};render()}
function choose(oid){selected=oid;tab='estimate';nav('detail')}
function setFilter(f){filter=f;render()}
function setTab(t){tab=t;edit={type:null,id:null};render()}
function kpi(label,v,highlight=false){return `<div class="kpi ${highlight?'emph':''}"><span>${label}</span><strong>${v}</strong></div>`}
function renderHome(){let items=state.objects.filter(o=>(filter==='all'||o.status===filter)&&(responsibleFilter==='all'||o.responsible===responsibleFilter));return `<div class="section-head"><div><h1 class="title">Мои объекты</h1><div class="muted small">${state.objects.length} всего · ${state.objects.filter(o=>o.status==='active').length} в работе</div></div><button class="btn" onclick="newObject()">+ Новый объект</button></div><div class="filters">${[['active','В работе'],['done','Завершённые'],['all','Все']].map(([v,l])=>`<button class="tab ${filter===v?'active':''}" onclick="setFilter('${v}')">${l}</button>`).join('')}</div><div class="filters"><label class="muted small" style="align-self:center">Ответственный:</label><select onchange="responsibleFilter=this.value;render()"><option value="all" ${responsibleFilter==='all'?'selected':''}>Все</option>${['Арчи','Мика'].map(x=>`<option ${responsibleFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid">${items.map(o=>{let c=calc(o),p=Math.max(0,Math.min(100,n(o.progress)));return `<article class="object" tabindex="0" role="button" onclick="choose('${o.id}')" onkeydown="if(event.key==='Enter')choose('${o.id}')"><div class="row between"><h3>${safe(o.name||'Без названия')}</h3><span class="status ${o.status==='done'?'done':''}">${o.status==='done'?'Завершён':'В работе'}</span></div><div class="muted small">${safe(o.partner||'Партнёр не указан')} · ${safe(o.responsible||'Арчи')}${n(o.area)>0?' · '+money(o.area)+' м²':''}</div><div class="progress"><div style="width:${p}%"></div></div><div class="row between small"><span class="muted">Выполнено ${p}%</span><b>${fmt(c.total)}</b></div></article>`}).join('')}</div>${items.length?'':'<div class="panel empty">Здесь пока нет объектов. Создайте новый или переключите фильтр.</div>'}`}
function newObject(){selected=null;view='create';render()}
function objectFields(o,prefix='obj'){return `<div class="formgrid"><div class="field"><label>Название объекта *</label><input id="${prefix}Name" value="${safe(o.name)}" placeholder="Например, Дом 350 м²"></div><div class="field"><label>Партнёр</label><input id="${prefix}Partner" value="${safe(o.partner)}"></div><div class="field"><label>Ответственный</label><select id="${prefix}Responsible">${opt(['Арчи','Мика'],o.responsible||'Арчи')}</select></div><div class="field"><label>Площадь, м²</label><input id="${prefix}Area" type="number" min="0" step="0.01" value="${n(o.area)||''}"></div><div class="field"><label>Дата начала (необязательно)</label><input id="${prefix}Start" type="date" value="${safe(o.start)}"></div><div class="field"><label>Дата завершения (необязательно)</label><input id="${prefix}End" type="date" value="${safe(o.end)}"></div><div class="field"><label>Готовность, %</label><input id="${prefix}Progress" type="number" min="0" max="100" value="${n(o.progress)}"></div><div class="field"><label>Статус</label><select id="${prefix}Status"><option value="active" ${o.status==='active'?'selected':''}>В работе</option><option value="done" ${o.status==='done'?'selected':''}>Завершён</option></select></div></div>`}
function collectObject(prefix,existing){let o={...existing,name:get(prefix+'Name').trim(),partner:get(prefix+'Partner').trim(),responsible:get(prefix+'Responsible'),area:value(prefix+'Area'),start:get(prefix+'Start'),end:get(prefix+'End'),progress:Math.max(0,Math.min(100,value(prefix+'Progress'))),status:get(prefix+'Status')};if(!o.name){alert('Введите название объекта');return null}if(o.area<0){alert('Площадь не может быть отрицательной');return null}if(o.start&&o.end&&o.end<o.start){alert('Дата завершения раньше даты начала');return null}return o}
function createObject(){let o=collectObject('obj',blankObject());if(!o)return;state.objects.push(o);if(persist())choose(o.id)}
function saveSettings(){let o=object(),updated=collectObject('obj',o);if(!updated)return;Object.assign(o,updated);o.planOverhead=value('planOverhead');o.commissionType=get('commissionType');o.commissionValue=value('commissionValue');if(persist()){alert('Настройки сохранены');render()}}
function renderCreate(){return `<div class="row between"><h1 class="title">Новый объект</h1><button class="btn secondary" onclick="nav('home')">← Назад</button></div><section class="panel">${objectFields(blankObject())}<div class="row" style="margin-top:16px"><button class="btn" onclick="createObject()">Создать объект</button></div></section>`}
function days(o){if(!o.start||!o.end)return '—';return Math.round((Date.parse(o.end+'T12:00:00')-Date.parse(o.start+'T12:00:00'))/86400000)+1+' дн.'}
function renderDetail(){let o=object();if(!o){nav('home');return ''}let c=calc(o);return `<div class="row between"><div><button class="btn ghost sm" onclick="nav('home')">← Все объекты</button><h1 class="title" style="margin-top:12px">${safe(o.name)}</h1><div class="muted small">${safe(o.partner||'Партнёр не указан')} · Ответственный: ${safe(o.responsible||'Арчи')} · ${n(o.area)>0?money(o.area)+' м² · ':''}${o.status==='done'?'Завершён':'В работе'} · ${n(o.progress)}%</div></div><span class="status ${o.status==='done'?'done':''}">${o.status==='done'?'Завершён':'В работе'}</span></div><div class="progress"><div style="width:${Math.max(0,Math.min(100,n(o.progress)))}%"></div></div><div class="kpis">${kpi('Основная смета',fmt(c.estimate))}${kpi('Допы',fmt(c.extras))}${kpi('Стоимость объекта',fmt(c.total),true)}${kpi('Поступило',fmt(c.income))}${kpi('Потрачено',fmt(c.expense))}${kpi('Осталось получить',fmt(c.remaining))}${kpi('Остаток денег',fmt(c.cash),true)}${kpi(o.status==='done'?'Прибыль после всех расходов':'Плановая прибыль',fmt(o.status==='done'?c.actualProfit:c.plannedProfit),true)}${kpi('Полная стоимость / м²',c.perSq===null?'—':fmt(c.perSq))}${kpi('Монтажные работы / м²',c.workSq===null?'—':fmt(c.workSq))}${kpi('Плановая маржа',c.total?((c.plannedProfit/c.total)*100).toFixed(1)+'%':'—')}${kpi('Прибыль по текущим расходам',fmt(c.actualProfit))}</div>${o.status==='done'&&Math.abs(c.remaining)>0.01?'<div class="notice" style="margin-bottom:14px">Внимание: по завершённому объекту расчёты с заказчиком ещё не сходятся.</div>':''}<div class="tabs">${[['estimate','Смета'],['extras','Допы'],['income','Поступления'],['expense','Расходы'],['documents','Документы'],['analytics','План / факт'],['settings','Настройки']].map(([v,l])=>`<button class="tab ${tab===v?'active':''}" onclick="setTab('${v}')">${l}</button>`).join('')}</div><section class="panel">${tab==='estimate'?renderEstimate(o):tab==='extras'?renderExtras(o):tab==='income'?renderOperations(o,'income'):tab==='expense'?renderOperations(o,'expense'):tab==='documents'?renderDocuments(o):tab==='analytics'?renderAnalytics(o):renderSettings(o,c)}</section>`}
function editRow(type,rowid){edit={type,id:rowid};render();setTimeout(()=>document.getElementById('entryForm')?.scrollIntoView({behavior:'smooth',block:'start'}),0)}
function cancelEdit(){edit={type:null,id:null};render()}
function removeRow(type,rowid){if(!confirm('Удалить запись?'))return;let o=object();o[type]=o[type].filter(x=>x.id!==rowid);persist();cancelEdit()}
function buttons(type,rowid){return `<div class="actions"><button class="btn secondary sm" onclick="editRow('${type}','${rowid}')">Изменить</button><button class="btn danger sm" onclick="removeRow('${type}','${rowid}')">×</button></div>`}
function estimateForm(type,entry){let isExtra=type==='extras',x=entry||{};return `<div id="entryForm"><h3>${entry?'Редактирование':'Добавление'} ${isExtra?'допработы':'раздела'}</h3><div class="formgrid">${isExtra?`<div class="field"><label>Название дополнительной работы *</label><input id="lineName" value="${safe(x.name||'')}" placeholder="Например, дополнительный радиатор"></div>`:''}<div class="field"><label>Инженерный раздел</label><select id="lineSection">${opt(sections,x.section||sections[0])}</select></div>${[['lineWork','Работы для заказчика','work'],['lineMaterial','Материалы для заказчика','material'],['lineTransport','Транспорт и накладные для заказчика','transport'],['linePlanWork','План затрат на работы','planWork'],['linePlanMaterial','План затрат на материалы','planMaterial'],['linePlanOther','План прочих затрат','planOther']].map(([f,label,k])=>`<div class="field"><label>${label}, ₽</label><input id="${f}" type="number" min="0" step="0.01" value="${n(x[k])||''}" placeholder="0"></div>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="saveLine('${type}')">${entry?'Сохранить изменения':'Добавить'}</button>${entry?'<button class="btn secondary" onclick="cancelEdit()">Отмена</button>':''}</div></div>`}
function saveLine(type){let o=object(),x={id:edit.type===type&&edit.id?edit.id:id(),section:get('lineSection'),work:value('lineWork'),material:value('lineMaterial'),transport:value('lineTransport'),planWork:value('linePlanWork'),planMaterial:value('linePlanMaterial'),planOther:value('linePlanOther')};if(type==='extras'){x.name=get('lineName').trim();if(!x.name){alert('Укажите название дополнительной работы');return}}if([x.work,x.material,x.transport,x.planWork,x.planMaterial,x.planOther].some(v=>v<0)){alert('Суммы не могут быть отрицательными');return}if(type==='estimate'&&o.estimate.some(a=>a.section===x.section&&a.id!==x.id)){alert('Этот раздел уже есть. Используйте кнопку «Изменить».');return}let i=o[type].findIndex(a=>a.id===x.id);if(i>=0)o[type][i]=x;else o[type].push(x);persist();cancelEdit()}

function rowToObject(r){return normalize({id:r.id,name:r.name,partner:r.partner||'',responsible:r.responsible||'Арчи',area:n(r.area),start:r.start_date||'',end:r.end_date||'',progress:n(r.progress),status:r.status,commissionType:r.commission_type||'none',commissionValue:n(r.commission_value),planOverhead:n(r.plan_overhead),estimate:[],extras:[],income:[],expense:[],documents:[]})}
function mapRow(table,r){if(table==='estimates')return {id:r.id,section:r.section,work:n(r.work),material:n(r.material),transport:n(r.transport),planWork:n(r.plan_work),planMaterial:n(r.plan_material),planOther:n(r.plan_other)};if(table==='extras')return {id:r.id,name:r.name,section:r.section,work:n(r.work),material:n(r.material),transport:n(r.transport),planWork:n(r.plan_work),planMaterial:n(r.plan_material),planOther:n(r.plan_other)};if(table==='incomes')return {id:r.id,date:r.date,amount:n(r.amount),note:r.note||''};if(table==='expenses')return {id:r.id,date:r.date,amount:n(r.amount),category:r.category,section:r.section||'',note:r.note||''};return r}
async function refreshCloud(){if(!sb)return;await cloudQueue;let {data:{user},error:authError}=await sb.auth.getUser();if(authError||!user){cloudReady=false;showLogin('Сессия истекла. Войдите снова.');return}cloudReady=false;$('app').innerHTML='<section class="panel">Загрузка данных из облака…</section>';let tables=['objects','estimates','extras','incomes','expenses','documents'];let results=await Promise.all(tables.map(t=>sb.from(t).select('*')));let failed=results.find(r=>r.error);if(failed){$('app').innerHTML=`<section class="panel">Ошибка загрузки: ${safe(failed.error.message)} <button class="btn" onclick="refreshCloud()">Повторить</button></section>`;return}let objects=results[0].data.map(rowToObject),byId=new Map(objects.map(o=>[o.id,o]));for(let i=1;i<tables.length;i++){let field={estimates:'estimate',extras:'extras',incomes:'income',expenses:'expense',documents:'documents'}[tables[i]];for(let r of results[i].data){let o=byId.get(r.object_id);if(o)o[field].push(mapRow(tables[i],r))}}state={version:3,objects};cloudSnapshot=clone(objects);cloudReady=true;$('identity').textContent=user.email;render()}
function objPayload(o){return {id:o.id,name:o.name,partner:o.partner||'',responsible:o.responsible||'Арчи',area:n(o.area),start_date:o.start||null,end_date:o.end||null,progress:n(o.progress),status:o.status,commission_type:o.commissionType||'none',commission_value:n(o.commissionValue),plan_overhead:n(o.planOverhead)}}
function recordPayload(table,oId,r){let p={id:r.id,object_id:oId};if(table==='estimates'||table==='extras'){p.section=r.section;p.work=n(r.work);p.material=n(r.material);p.plan_work=n(r.planWork);p.plan_material=n(r.planMaterial);p.plan_other=n(r.planOther);p.transport=n(r.transport);if(table==='extras')p.name=r.name}else if(table==='incomes'){p.date=r.date;p.amount=n(r.amount);p.note=r.note||''}else if(table==='expenses'){p.date=r.date;p.amount=n(r.amount);p.category=r.category;p.section=r.section||'';p.note=r.note||''}return p}
const TABLES={estimate:'estimates',extras:'extras',income:'incomes',expense:'expenses'};
async function applyChange(table,kind,payload,recordId){let q;if(kind==='delete')q=sb.from(table).delete().eq('id',recordId);else if(kind==='insert')q=sb.from(table).insert(payload);else q=sb.from(table).update(payload).eq('id',recordId);let {error}=await q;if(error)throw Error(`${table}: ${error.message}`)}
async function syncChanges(before,after){let prev=new Map(before.map(o=>[o.id,o])),next=new Map(after.map(o=>[o.id,o]));for(let o of before)if(!next.has(o.id)){await applyChange('objects','delete',null,o.id)}for(let o of after){let old=prev.get(o.id);let payload=objPayload(o);if(!old)await applyChange('objects','insert',payload);else if(JSON.stringify(objPayload(old))!==JSON.stringify(payload))await applyChange('objects','update',payload,o.id);for(let [field,table] of Object.entries(TABLES)){let was=new Map((old?.[field]||[]).map(r=>[r.id,r]));let now=new Map(o[field].map(r=>[r.id,r]));for(let r of old?.[field]||[])if(!now.has(r.id))await applyChange(table,'delete',null,r.id);for(let r of o[field]){let original=was.get(r.id),p=recordPayload(table,o.id,r);if(!original)await applyChange(table,'insert',p);else if(JSON.stringify(recordPayload(table,o.id,original))!==JSON.stringify(p))await applyChange(table,'update',p,r.id)}}}}
function queueCloudSave(){if(!cloudReady){alert('Облако ещё не загружено. Изменения не сохранены.');return}let before=clone(cloudSnapshot),after=clone(state.objects);cloudSnapshot=clone(after);cloudQueue=cloudQueue.then(async()=>{if(!cloudReady)return;cloudBusy=true;try{await syncChanges(before,after)}catch(e){cloudReady=false;alert('Не удалось сохранить в облако: '+e.message+'\nОбновите страницу, чтобы загрузить актуальные данные.')}finally{cloudBusy=false}});return cloudQueue}
function renderAnalytics(o){let c=calc(o),revenue=c.total,spent=c.expense;let group=sections.filter(s=>[...o.estimate,...o.extras].some(r=>r.section===s)||o.expense.some(r=>r.section===s));return `<div class="section-head"><h2>План / факт по объекту</h2></div><div class="kpis">${kpi('Стоимость по смете',fmt(revenue))}${kpi('Плановые затраты',fmt(c.plan))}${kpi('Фактические расходы на сегодня',fmt(spent))}${kpi('Плановая прибыль',fmt(c.plannedProfit),true)}${kpi('Расчётная прибыль по текущим расходам',fmt(c.actualProfit))}${kpi('Плановая маржа',revenue?(100*c.plannedProfit/revenue).toFixed(1)+'%':'—')}</div><p class="notice">Фактическая прибыль по завершённому объекту = выручка − все расходы. По действующему объекту это промежуточная оценка: будущие расходы ещё не учтены. Расходы без раздела показаны отдельно и включены в общий итог.</p><div class="tablewrap"><table><thead><tr><th>Раздел</th><th class="num">Выручка</th><th class="num">План затрат</th><th class="num">Факт расходов</th><th class="num">План прибыль</th><th class="num">Прибыль по текущим расходам</th></tr></thead><tbody>${group.map(s=>{let lines=[...o.estimate,...o.extras].filter(x=>x.section===s),rev=sum(lines,lineRevenue),plan=sum(lines,linePlan),spent=sum(o.expense,x=>x.section===s?n(x.amount):0);return `<tr><td>${safe(s)}</td><td class="num">${fmt(rev)}</td><td class="num">${fmt(plan)}</td><td class="num">${fmt(spent)}</td><td class="num">${fmt(rev-plan)}</td><td class="num">${fmt(rev-spent)}</td></tr>`}).join('')}</tbody></table></div><p class="muted small">Нераспределённые расходы: ${fmt(sum(o.expense,x=>!x.section||x.section==='Общие расходы'?n(x.amount):0))}. Комиссия партнёру учитывается в плановой прибыли объекта.</p>`}
function renderDocuments(o){return `<div class="section-head"><h2>Документы объекта</h2></div><p class="muted">Файлы хранятся в приватном Supabase Storage. Арчи и Мика имеют одинаковый доступ. Excel-файлы браузер обычно скачивает; для редактирования используйте ссылку на облачный документ.</p><div class="tablewrap"><table><thead><tr><th>Название</th><th>Тип</th><th>Действия</th></tr></thead><tbody>${o.documents.map(d=>`<tr><td>${safe(d.name)}</td><td>${d.document_type==='file'?'Файл':'Онлайн-ссылка'}</td><td class="actions"><button class="btn secondary sm" onclick="openDocument('${d.id}')">${d.document_type==='file'?'Открыть / скачать':'Открыть онлайн'}</button> <button class="btn danger sm" onclick="deleteDocument('${d.id}')">Удалить</button></td></tr>`).join('')}</tbody></table></div><hr class="line"><h3>Прикрепить файл</h3><div class="field"><input type="file" id="docFile"></div><button class="btn" onclick="uploadDocument()">Загрузить файл</button><hr class="line"><h3>Добавить ссылку на онлайн-смету</h3><div class="formgrid"><div class="field"><label>Название</label><input id="docName" placeholder="Например, Смета отопления"></div><div class="field"><label>Ссылка https://</label><input id="docUrl" type="url" placeholder="https://..."></div></div><button class="btn" onclick="addDocumentLink()">Добавить ссылку</button>`}
async function uploadDocument(){if(!cloudReady)return alert('Нет подключения к облаку. Обновите страницу.');await cloudQueue;let file=$('docFile')?.files?.[0],o=object();if(!file)return alert('Выберите файл');if(file.size>50*1024*1024)return alert('Файл больше 50 МБ');let path=`${o.id}/${id()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(error)return alert(error.message);let {data,error:dbError}=await sb.from('documents').insert({object_id:o.id,name:file.name,document_type:'file',storage_path:path}).select().single();if(dbError){await sb.storage.from(BUCKET).remove([path]);return alert(dbError.message)}await refreshCloud()}
async function addDocumentLink(){if(!cloudReady)return alert('Нет подключения к облаку. Обновите страницу.');await cloudQueue;let o=object(),name=get('docName').trim(),url=get('docUrl').trim();if(!name||!/^https:\/\//i.test(url))return alert('Укажите название и ссылку https://');let {data,error}=await sb.from('documents').insert({object_id:o.id,name,document_type:'link',url}).select().single();if(error)return alert(error.message);await refreshCloud()}
async function openDocument(did){let d=object().documents.find(x=>x.id===did);if(!d)return;if(d.document_type==='link'){window.open(d.url,'_blank','noopener,noreferrer');return}let {data,error}=await sb.storage.from(BUCKET).createSignedUrl(d.storage_path,120);if(error)return alert(error.message);let a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}
async function deleteDocument(did){let o=object(),d=o.documents.find(x=>x.id===did);if(!d||!confirm('Удалить документ?'))return;let {error}=await sb.from('documents').delete().eq('id',did);if(error)return alert(error.message);if(d.document_type==='file'&&d.storage_path){let {error:storageError}=await sb.storage.from(BUCKET).remove([d.storage_path]);if(storageError)alert('Запись удалена, но файл не удалился из хранилища: '+storageError.message)}await refreshCloud()}
